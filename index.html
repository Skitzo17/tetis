<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tétis">
  <title>Tétis</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topo">
    <a href="#inicio" class="marca">Tétis</a>
    <span class="topo-acoes">
    <a href="#perfil" id="avatar-topo" class="topo-avatar" aria-label="Perfil"></a>
    <a href="#config" class="icone-btn" aria-label="Configurações">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </a>
    </span>
  </header>

  <main id="app"></main>

  <nav class="abas" aria-label="Seções">
    <a href="#inicio" data-aba="inicio">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>Início</span>
    </a>
    <a href="#treino" data-aba="treino">
      <svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>
      <span>Treino</span>
    </a>
    <a href="#peso" data-aba="peso">
      <svg viewBox="0 0 24 24"><path d="M3 17l5-5 4 4 8-8M15 8h5v5"/></svg>
      <span>Peso</span>
    </a>
    <a href="#notas" data-aba="notas">
      <svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 12h7M9 16h7"/></svg>
      <span>Notas</span>
    </a>
    <a href="#financas" data-aba="financas">
      <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/></svg>
      <span>Finanças</span>
    </a>
  </nav>

  <dialog id="modal">
    <form method="dialog" id="modal-form">
      <h2 id="modal-titulo"></h2>
      <div id="modal-corpo"></div>
      <div class="modal-acoes">
        <button value="cancelar" formnovalidate class="btn">Cancelar</button>
        <button value="ok" id="modal-ok" class="btn primario">Salvar</button>
      </div>
    </form>
  </dialog>

  <div id="timer" hidden role="timer" aria-live="off">
    <div id="timer-barra"></div>
    <span class="timer-rotulo">Descanso</span>
    <span id="timer-txt">0:00</span>
    <button class="timer-btn" data-act="maisDescanso" aria-label="Mais 15 segundos">+15s</button>
    <button class="timer-btn" data-act="pararDescanso" aria-label="Parar descanso">✕</button>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="plano.js"></script>
  <script src="app.js"></script>
</body>
</html>
